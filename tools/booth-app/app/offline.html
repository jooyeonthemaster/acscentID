<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>AC'SCENT WOW 포토부스</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #fff;
        font-family: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
        padding: 16px;
        user-select: none;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 800;
      }
      p {
        margin: 0;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.6);
      }
      small {
        color: rgba(255, 255, 255, 0.3);
        font-size: 13px;
      }
      .spin {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #fff;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        margin-top: 8px;
        min-height: 56px;
        padding: 0 32px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #0a0a0a;
        font-size: 18px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="spin"></div>
    <h1>포토부스를 준비하고 있어요</h1>
    <p>인터넷 연결을 확인하는 중입니다. 5초마다 다시 시도합니다.</p>
    <button type="button" onclick="window.boothShell && window.boothShell.reload()">지금 다시 시도</button>
    <small id="detail"></small>
    <script>
      const q = new URLSearchParams(location.search)
      document.getElementById('detail').textContent = [q.get('reason'), q.get('url')]
        .filter(Boolean)
        .join(' · ')
    </script>
  </body>
</html>
