    <rect x="1144" y="300" width="452" height="568" rx="10" fill="url(#paper)" stroke="#111318" stroke-width="5"/>
    <rect x="1168" y="326" width="404" height="516" rx="6" fill="#FFF9E9" stroke="#111318" stroke-width="2.5" opacity="0.9"/>
    <rect x="1190" y="352" width="158" height="32" rx="16" fill="#FFC400" stroke="#111318" stroke-width="3"/>
    <text x="1269" y="374" text-anchor="middle" class="small" font-size="15">레이어링 퍼퓸</text>
    <text x="1190" y="426" class="title" font-size="31" fill="#111318">두 향의 간격을</text>
