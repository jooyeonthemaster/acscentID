    <path d="M278 692C318 610 372 586 424 626C472 664 506 590 582 646V722H278Z" fill="#DACDB5"/>
    <circle cx="416" cy="586" r="42" fill="#111318" opacity="0.82"/>
    <rect x="278" y="750" width="270" height="14" rx="7" fill="#111318" opacity="0.16"/>
    <rect x="278" y="780" width="210" height="14" rx="7" fill="#111318" opacity="0.12"/>

