      <path d="M140 150H338V1050H140Z" fill="#F8F3E8" stroke="#111318" stroke-width="4"/>
      <path d="M720 150H522V1050H720Z" fill="#F8F3E8" stroke="#111318" stroke-width="4"/>
      <rect x="184" y="196" width="118" height="32" rx="16" fill="#FFC400" stroke="#111318" stroke-width="3"/>
      <text x="243" y="218" text-anchor="middle" class="small" font-size="14">PHOTO</text>
      <path d="M204 296H296M204 812H296" stroke="#111318" stroke-width="3" opacity="0.2"/>
      <path d="M562 296H654M562 812H654" stroke="#111318" stroke-width="3" opacity="0.2"/>
      <rect x="318" y="150" width="20" height="900" fill="#111318"/>
      <rect x="522" y="150" width="20" height="900" fill="#111318"/>
      <circle cx="338" cy="602" r="22" fill="#FFC400" stroke="#111318" stroke-width="4"/>
      <circle cx="522" cy="602" r="22" fill="#FFC400" stroke="#111318" stroke-width="4"/>
    </g>

    <rect x="214" y="902" width="432" height="20" rx="10" fill="#F8F3E8" opacity="0.18"/>
    <rect x="214" y="902" width="330" height="20" rx="10" fill="#FFC400"/>
    <text x="646" y="952" text-anchor="end" class="mono" font-size="17" fill="#F8F3E8">ANALYZING 89%</text>
  </g>
  <rect x="120" y="130" width="620" height="940" rx="60" fill="none" stroke="#111318" stroke-width="3"/>

