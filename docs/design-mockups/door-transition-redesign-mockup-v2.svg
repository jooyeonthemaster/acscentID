  <g>
    <rect x="814" y="426" width="172" height="268" rx="8" fill="#FFFDF3" stroke="#111318" stroke-width="3"/>
    <rect x="834" y="448" width="132" height="34" rx="17" fill="#FFC400" stroke="#111318" stroke-width="3"/>
    <text x="900" y="471" text-anchor="middle" class="small" font-size="14">변경 방향</text>
    <text x="900" y="528" text-anchor="middle" class="copy" font-size="17">덜 장치적</text>
    <text x="900" y="570" text-anchor="middle" class="copy" font-size="17">더 상품 카드처럼</text>
    <text x="900" y="612" text-anchor="middle" class="copy" font-size="17">브랜드 컬러 유지</text>
    <text x="900" y="654" text-anchor="middle" class="mono" font-size="13" fill="#5C574C">slide contract same</text>
  </g>

