<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#06070A" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06070A" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF3"/>
      <stop offset="1" stop-color="#F4EBD7"/>
    </linearGradient>
    <linearGradient id="paperPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F9DCE2"/>
    </linearGradient>
    <linearGradient id="paperMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#DCEFE5"/>
    </linearGradient>
    <pattern id="grain" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M8 12H9M28 20H29M42 8H43M18 42H19M48 34H49" stroke="#161616" stroke-width="1.4" opacity="0.08"/>
    </pattern>
    <clipPath id="phoneA">
      <rect x="140" y="150" width="580" height="900" rx="44"/>
    </clipPath>
    <clipPath id="phoneB">
      <rect x="1080" y="150" width="580" height="900" rx="44"/>
    </clipPath>
    <style>
      .title { font-family: Pretendard, Inter, Arial, sans-serif; font-weight: 900; letter-spacing: 0; fill: #111318; }
      .copy { font-family: Pretendard, Inter, Arial, sans-serif; font-weight: 700; letter-spacing: 0; fill: #4D4B45; }
      .small { font-family: Pretendard, Inter, Arial, sans-serif; font-weight: 800; letter-spacing: 0; fill: #111318; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 800; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#F8F3E8"/>
  <rect x="0" y="0" width="1800" height="54" fill="#FFC400"/>
  <text x="900" y="35" text-anchor="middle" class="small" font-size="18">AC'SCENT IDENTITY · 조용한 문 전환 재시안 · 실제 적용 없음</text>

  <text x="92" y="108" class="title" font-size="40">Door Transition Redesign Mockup v2</text>
  <text x="92" y="148" class="copy" font-size="19">Tone checked from the local site: cream paper, black outlines, yellow CTA, restrained kitsh accents.</text>

  <!-- Left phone: image analysis -->
  <g filter="url(#shadow)">
    <rect x="120" y="130" width="620" height="940" rx="60" fill="#111318"/>
    <rect x="140" y="150" width="580" height="900" rx="44" fill="#0B0E16"/>
  </g>
  <g clip-path="url(#phoneA)">
    <rect x="140" y="150" width="580" height="900" fill="#0B0E16"/>
    <rect x="140" y="150" width="580" height="900" fill="url(#grain)" opacity="0.3"/>

    <text x="430" y="217" text-anchor="middle" class="title" font-size="26" fill="#F8F3E8">AC'SCENT</text>
    <text x="430" y="243" text-anchor="middle" class="mono" font-size="12" fill="#AFA793">IMAGE ANALYSIS PERFUME</text>

    <rect x="204" y="300" width="452" height="568" rx="10" fill="url(#paper)" stroke="#111318" stroke-width="5"/>
    <rect x="228" y="326" width="404" height="516" rx="6" fill="#FFF9E9" stroke="#111318" stroke-width="2.5" opacity="0.9"/>
