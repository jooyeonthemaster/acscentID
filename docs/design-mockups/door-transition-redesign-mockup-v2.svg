    <rect x="1190" y="520" width="360" height="178" rx="8" fill="#F7F0DF" stroke="#111318" stroke-width="3"/>
    <path d="M1222 610C1270 560 1324 662 1372 612S1464 566 1518 620" fill="none" stroke="#74B897" stroke-width="10" stroke-linecap="round" opacity="0.62"/>
    <path d="M1222 650C1284 598 1332 700 1394 650S1470 612 1518 664" fill="none" stroke="#E47191" stroke-width="10" stroke-linecap="round" opacity="0.52"/>
    <circle cx="1302" cy="608" r="38" fill="#F8F3E8" stroke="#111318" stroke-width="3"/>
    <circle cx="1438" cy="608" r="38" fill="#F8F3E8" stroke="#111318" stroke-width="3"/>
    <text x="1302" y="617" text-anchor="middle" class="small" font-size="26">A</text>
    <text x="1438" y="617" text-anchor="middle" class="small" font-size="26">B</text>
    <rect x="1350" y="588" width="40" height="40" rx="20" fill="#FFC400" stroke="#111318" stroke-width="3"/>
    <text x="1370" y="614" text-anchor="middle" class="small" font-size="20">x</text>

    <!-- quiet opening door halves: scent blotters -->
    <g filter="url(#soft)">
      <path d="M1080 150H1278V1050H1080Z" fill="url(#paperMint)" stroke="#111318" stroke-width="4"/>
      <path d="M1660 150H1462V1050H1660Z" fill="url(#paperPink)" stroke="#111318" stroke-width="4"/>
      <path d="M1120 276H1238M1120 344H1238M1120 412H1238M1120 480H1238M1120 548H1238M1120 616H1238M1120 684H1238M1120 752H1238" stroke="#111318" stroke-width="3" opacity="0.12"/>
      <path d="M1502 276H1620M1502 344H1620M1502 412H1620M1502 480H1620M1502 548H1620M1502 616H1620M1502 684H1620M1502 752H1620" stroke="#111318" stroke-width="3" opacity="0.12"/>
      <rect x="1118" y="196" width="102" height="32" rx="16" fill="#FFC400" stroke="#111318" stroke-width="3"/>
      <text x="1169" y="218" text-anchor="middle" class="small" font-size="14">A NOTE</text>
      <rect x="1518" y="196" width="102" height="32" rx="16" fill="#FFC400" stroke="#111318" stroke-width="3"/>
      <text x="1569" y="218" text-anchor="middle" class="small" font-size="14">B NOTE</text>
      <rect x="1258" y="150" width="20" height="900" fill="#111318"/>
      <rect x="1462" y="150" width="20" height="900" fill="#111318"/>
    </g>

    <rect x="1154" y="902" width="432" height="20" rx="10" fill="#F8F3E8" opacity="0.18"/>
    <rect x="1154" y="902" width="330" height="20" rx="10" fill="#FFC400"/>
    <text x="1586" y="952" text-anchor="end" class="mono" font-size="17" fill="#F8F3E8">BLENDING 89%</text>
  </g>
  <rect x="1060" y="130" width="620" height="940" rx="60" fill="none" stroke="#111318" stroke-width="3"/>

  <text x="430" y="1092" text-anchor="middle" class="copy" font-size="22">이미지 분석: 사진 리포트 봉투가 좌우로 열림</text>
  <text x="1370" y="1092" text-anchor="middle" class="copy" font-size="22">케미 분석: 두 시향지가 겹쳤다가 열림</text>
</svg>
