<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    @font-face{font-family:Pretendard;src:url('http://localhost:3000/fonts/pretendard/PretendardVariable.woff2')}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,sans-serif;color:var(--ink);background:var(--bg)}
    body.v1{--bg:#fbf6ea;--ink:#27354a;--muted:#667183;--line:rgba(64,96,122,.18);--card:rgba(255,253,246,.86);--accent:#e66f61;--shadow:0 16px 42px rgba(70,92,109,.12);background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),url('http://localhost:3000/assets/photobooth/concepts/01-gingham-stationery.png')}
    body.v2{--bg:#f3efe5;--ink:#1f3e63;--muted:#69717b;--line:rgba(31,62,99,.22);--card:rgba(255,253,247,.9);--accent:#d94a43;--shadow:7px 8px 0 rgba(31,62,99,.12);background-image:url('http://localhost:3000/assets/photobooth/concepts/02-scrapbook-ticket.png')}
    body.v3{--bg:#dff4ff;--ink:#244866;--muted:#4e7185;--line:rgba(49,105,137,.2);--card:rgba(255,255,255,.58);--accent:#ff876b;--shadow:0 20px 50px rgba(55,139,173,.13);background-image:linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08)),url('http://localhost:3000/assets/photobooth/concepts/03-airy-gradient.png')}
    body.v4{--bg:#f9f0dc;--ink:#12477c;--muted:#5d6670;--line:#164f86;--card:#fff9eb;--accent:#d93831;--shadow:8px 8px 0 #ffd257;background-image:url('http://localhost:3000/assets/photobooth/concepts/04-retro-check.png')}
    body{min-height:100vh;background-position:center;background-size:cover;background-attachment:fixed}.wash{position:fixed;inset:0;background:rgba(255,255,255,.08);pointer-events:none}.top{height:72px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(255,255,255,.28);backdrop-filter:blur(15px)}.logo{font-size:20px;font-weight:850;letter-spacing:.22em}.tag{padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13px;font-weight:800;letter-spacing:.08em}.wrap{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:42px}.content{width:min(980px,100%);text-align:center}.kicker{display:inline-flex;padding:9px 15px;border-radius:999px;background:var(--accent);color:white;font-size:13px;font-weight:850;letter-spacing:.16em;box-shadow:var(--shadow)}h1{font-size:48px;line-height:1.12;margin:22px 0 10px;font-weight:900;letter-spacing:-.04em}.sub{margin:0 0 38px;font-size:18px;color:var(--muted);font-weight:550}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{min-height:230px;padding:28px;text-align:left;border:1.5px solid var(--line);border-radius:26px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(13px);position:relative;overflow:hidden}.v2 .card{border-radius:9px}.v2 .card:before{content:'';position:absolute;left:0;right:0;top:56px;border-top:2px dashed rgba(31,62,99,.17)}.v4 .card{border:3px solid var(--line);border-radius:18px}.num{font:800 13px/1 Pretendard;color:var(--accent);letter-spacing:.12em}.icon{width:48px;height:48px;margin:30px 0 19px;border:2px solid currentColor;border-radius:16px;display:grid;place-items:center;font-size:22px;font-weight:900}.title{font-size:23px;font-weight:850;margin-bottom:9px}.desc{font-size:16px;line-height:1.55;color:var(--muted)}.foot{margin-top:28px;font-size:15px;color:var(--muted);font-weight:650}.choice{position:fixed;right:24px;bottom:22px;background:var(--ink);color:white;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:850;box-shadow:var(--shadow)}
  </style>
</head>
<body><div class="wash"></div><header class="top"><div class="logo">AC'SCENT WOW PHOTO</div><div class="tag">4×6 PHOTO BENEFIT</div></header><main class="wrap"><section class="content"><div class="kicker">HAPPY BIRTHDAY WEEK</div><h1>어떤 사진을 찍을까요?</h1><p class="sub">오늘의 마음을 4×6 인화 특전으로 간직해요</p><div class="cards"><article class="card"><div class="num">01 · TOGETHER</div><div class="icon">♡</div><div class="title">최애와 찍기</div><div class="desc">준비된 컷의 빈자리에<br>옆에 선 것처럼 합성해요</div></article><article class="card"><div class="num">02 · MY PICK</div><div class="icon">▣</div><div class="title">포카와 찍기</div><div class="desc">폰 속 포카와 직찍을 올려서<br>한 장의 추억으로 만들어요</div></article><article class="card"><div class="num">03 · PHOTO</div><div class="icon">◎</div><div class="title">일반 촬영</div><div class="desc">한 컷 또는 네 컷으로<br>지금 이 순간을 담아요</div></article></div><p class="foot">✦ 상품 구매 시 받은 이용권으로 시작할 수 있어요</p></section></main><div class="choice"></div><script>const v=Math.min(4,Math.max(1,Number(new URLSearchParams(location.search).get('v'))||1));document.body.className='v'+v;const names=['파스텔 깅엄','스크랩북 티켓','에어리 그라데이션','레트로 체크'];document.querySelector('.choice').textContent=`${v}안 · ${names[v-1]}`;</script></body>
</html>
